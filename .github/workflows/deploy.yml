name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check secrets
        env:
          V_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          V_ACC: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::notice title=secrets::token_len=${#CLOUDFLARE_API_TOKEN} account_len=${#CLOUDFLARE_ACCOUNT_ID} vars_token_len=${#V_TOKEN} vars_account_len=${#V_ACC}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error title=secrets::CLOUDFLARE_API_TOKEN пуст — секрет не найден в Repository secrets"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error title=secrets::CLOUDFLARE_ACCOUNT_ID пуст"; exit 1; fi
      - run: npm ci
      - run: npm test
      # Типы тестов и их помощников (tests/**) проверяются отдельным tsconfig.tests.json: типы DOM и Workers вместе,
      # поэтому expectTypeOf в tests/types.test.ts срабатывает по-настоящему. Падение останавливает деплой.
      - name: Typecheck tests
        run: |
          CODE=0; OUT=$(npm run lint:tests 2>&1) || CODE=$?
          ERRORS=$(echo "$OUT" | grep -cE 'error TS' || true)
          echo "::notice title=typecheck tests::tsconfig.tests.json: $([ "$CODE" = 0 ] && echo ok || echo "ошибок типов: $ERRORS; первая: $(echo "$OUT" | grep -m1 -E 'error TS' | cut -c1-400)")"
          exit $CODE
      - run: npm run build

      # Сценарии Playwright (e2e/*.e2e.ts) на собранном dist: вход по коду, резюме и анкета, главный экран, занятие, тест, репетиция, срез, программа, журнал, достижения, банк, настройки, телефон, /install.
      # Браузер кэшируется по версии playwright из lock-файла; падение сценариев останавливает деплой.
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E scenarios (Playwright)
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          npm run lint:e2e
          CODE=0; npm run e2e 2>&1 | tee e2e.log || CODE=$?
          SUMMARY=$(grep -E 'Test Files|Tests ' e2e.log | sed 's/^ *//' | tr "\n" " ")
          FAILED=$(grep -E '^\s*(×|FAIL)' e2e.log | sed 's/^ *//' | head -5 | tr "\n" " ")
          echo "::notice title=e2e::${SUMMARY:-вывод vitest не найден}${FAILED:+; упали: ${FAILED:0:600}}"
          exit $CODE

      - name: Ensure Pages project exists
        run: npx wrangler pages project create offerly --production-branch main || true

      - name: Ensure D1 database exists and resolve its id
        id: d1
        run: |
          set +e
          mv wrangler.toml wrangler.toml.tpl
          CREATE=$(npx wrangler d1 create offerly 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 create::${CREATE:0:600}"
          INFO=$(npx wrangler d1 info offerly --json 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 info::${INFO:0:600}"
          ID=$(echo "$INFO" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.uuid||j.id||"")}catch(e){console.log("")}})')
          mv wrangler.toml.tpl wrangler.toml
          set -e
          if [ -z "$ID" ]; then echo "::error title=d1::database id not resolved"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply offerly --remote

      - name: Seed first user (idempotent)
        run: |
          set -o pipefail
          OUT=$(npx wrangler d1 execute offerly --remote --yes --file seed/first_user.sql 2>&1 | tr "\n\r" "  ") || { echo "::error title=seed::seed/first_user.sql не применился: ${OUT:0:600}"; exit 1; }
          echo "::notice title=seed::применён seed/first_user.sql: ${OUT:0:300}"
          Q="SELECT (SELECT count(*) FROM users WHERE email = 'ysamussenko@gmail.com') AS first_user, (SELECT count(*) FROM assessments WHERE kind = 'baseline') AS baseline, (SELECT count(*) FROM error_cards WHERE source = 'seed') AS seed_cards, (SELECT count(*) FROM error_cards) AS all_cards, (SELECT count(*) FROM error_cards WHERE retired = 1) AS retired, (SELECT count(*) FROM error_cards WHERE reviewed_at IS NOT NULL OR origin IS NOT NULL) AS fsrs_touched"
          CNT=$(npx wrangler d1 execute offerly --remote --yes --json --command "$Q" 2>&1 | tr "\n\r" "  ")
          echo "::notice title=seed counts::${CNT:0:500}"

      - name: Push mail secret to Pages (if set)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            OUT=$(printf '%s' "$RESEND_API_KEY" | npx wrangler pages secret put RESEND_API_KEY --project-name offerly 2>&1 | tr "\n\r" "  ")
            echo "::notice title=mail::RESEND_API_KEY передан в Pages: ${OUT:0:300}"
          else
            echo "::notice title=mail::RESEND_API_KEY не задан — вход по почте вернёт mail_not_configured"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          OUT=$(npx wrangler pages deploy dist --project-name offerly --branch main --commit-dirty=true 2>&1 | tee deploy.log | tr "\n\r" "  ")
          echo "::notice title=deploy::${OUT:0:800}"
          PREVIEW=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          HOST=${PREVIEW#https://}
          PROD="https://${HOST#*.}"
          echo "::notice title=url::production=$PROD preview=$PREVIEW"
          echo "prod=$PROD" >> "$GITHUB_OUTPUT"

      # 4.4: cron-Worker ежедневного письма — отдельный от Pages деплой-объект (Pages Functions не умеют расписание).
      # Та же база D1 и тот же RESEND_API_KEY. Сбой здесь не валит деплой приложения: предупреждение в аннотациях,
      # причина (чаще всего — токену не хватает права Workers Scripts: Edit) видна в digest deploy.
      - name: Deploy digest Worker (cron)
        id: digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          sed -i "s/__D1_ID__/${{ steps.d1.outputs.id }}/" workers/digest/wrangler.toml
          npx wrangler deploy --config workers/digest/wrangler.toml > digest-deploy.log 2>&1; CODE=$?
          OUT=$(tr "\n\r" "  " < digest-deploy.log)
          if [ "$CODE" != "0" ]; then
            echo "::warning title=digest deploy::Worker offerly-digest не задеплоен (код $CODE): ${OUT:0:700}"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' digest-deploy.log | tail -1)
          SCHED=$(grep -iE 'schedule|cron' digest-deploy.log | tr "\n\r" "  ")
          echo "::notice title=digest deploy::${OUT:0:600}"
          echo "::notice title=digest url::${URL:-адрес workers.dev не напечатан — поддомен workers.dev не зарегистрирован; cron работает и без него}; расписание: ${SCHED:-строка schedule в выводе wrangler не найдена}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$RESEND_API_KEY" ]; then
            SEC=$(printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config workers/digest/wrangler.toml 2>&1 | tr "\n\r" "  ") || echo "::warning title=digest secret::RESEND_API_KEY не передан Worker: ${SEC:0:400}"
            echo "::notice title=digest secret::${SEC:0:300}"
          else
            echo "::notice title=digest secret::RESEND_API_KEY не задан — Worker отметит дни skipped:mail_not_configured"
          fi

      # Дымовые проверки живого адреса — scripts/smoke.mjs (их можно гонять и локально против стенда: npm run smoke -- <адрес>).
      # Скрипт сам печатает аннотации; группы разнесены по шагам, потому что GitHub показывает не больше 10 notice на шаг.
      - name: Health check
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.prod }}" --group health --wait 20

      - name: Smoke test
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.prod }}" --group smoke

      # extract/ai_chat/analysis (?deep=2), PWA, репетиция, голос, срез, письмо (с состоянием cron-Worker), push, настройки
      - name: Deep check (extract, model, analysis)
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.prod }}" --group deep --worker "${{ steps.digest.outputs.url }}"

      # Страница установки (5.1): /install — оболочка SPA, /api/release открыт без cookie и отвечает 200 даже без релизов.
      - name: Install page check
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.prod }}" --group install
