name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Ensure Pages project exists
        run: npx wrangler pages project create offerly --production-branch main || true

      - name: Ensure D1 database exists and resolve its id
        id: d1
        run: |
          set +e
          mv wrangler.toml wrangler.toml.tpl
          CREATE=$(npx wrangler d1 create offerly 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 create::${CREATE:0:600}"
          INFO=$(npx wrangler d1 info offerly --json 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 info::${INFO:0:600}"
          ID=$(echo "$INFO" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.uuid||j.id||"")}catch(e){console.log("")}})')
          mv wrangler.toml.tpl wrangler.toml
          set -e
          if [ -z "$ID" ]; then echo "::error title=d1::database id not resolved"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply offerly --remote

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name offerly --branch main --commit-dirty=true

      - name: Smoke test
        run: |
          sleep 20
          curl -fsS https://offerly.pages.dev/api/health | tee health.json
          node -e 'const h=require("./health.json"); if(!h.ok){console.error("health not ok", h); process.exit(1)}'
