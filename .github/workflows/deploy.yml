name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check secrets
        env:
          V_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          V_ACC: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::notice title=secrets::token_len=${#CLOUDFLARE_API_TOKEN} account_len=${#CLOUDFLARE_ACCOUNT_ID} vars_token_len=${#V_TOKEN} vars_account_len=${#V_ACC}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error title=secrets::CLOUDFLARE_API_TOKEN пуст — секрет не найден в Repository secrets"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error title=secrets::CLOUDFLARE_ACCOUNT_ID пуст"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Ensure Pages project exists
        run: npx wrangler pages project create offerly --production-branch main || true

      - name: Ensure D1 database exists and resolve its id
        id: d1
        run: |
          set +e
          mv wrangler.toml wrangler.toml.tpl
          CREATE=$(npx wrangler d1 create offerly 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 create::${CREATE:0:600}"
          INFO=$(npx wrangler d1 info offerly --json 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 info::${INFO:0:600}"
          ID=$(echo "$INFO" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.uuid||j.id||"")}catch(e){console.log("")}})')
          mv wrangler.toml.tpl wrangler.toml
          set -e
          if [ -z "$ID" ]; then echo "::error title=d1::database id not resolved"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply offerly --remote

      - name: Push mail secret to Pages (if set)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            OUT=$(printf '%s' "$RESEND_API_KEY" | npx wrangler pages secret put RESEND_API_KEY --project-name offerly 2>&1 | tr "\n\r" "  ")
            echo "::notice title=mail::RESEND_API_KEY передан в Pages: ${OUT:0:300}"
          else
            echo "::notice title=mail::RESEND_API_KEY не задан — вход по почте вернёт mail_not_configured"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          OUT=$(npx wrangler pages deploy dist --project-name offerly --branch main --commit-dirty=true 2>&1 | tee deploy.log | tr "\n\r" "  ")
          echo "::notice title=deploy::${OUT:0:800}"
          PREVIEW=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          HOST=${PREVIEW#https://}
          PROD="https://${HOST#*.}"
          echo "::notice title=url::production=$PROD preview=$PREVIEW"
          echo "prod=$PROD" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          sleep 20
          P="${{ steps.deploy.outputs.prod }}"
          curl -fsS "$P/api/health" | tee health.json
          echo "::notice title=health::$(tr -d '\n' < health.json)"
          node -e 'const h=require("./health.json"); if(!h.ok||h.db!=="ok"||h.ai!=="ok"){console.error("health not ok", h); process.exit(1)}'
          ME=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/me")
          REQ=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"email":"bad"}' "$P/api/auth/request")
          echo "::notice title=auth::GET /api/me без cookie → $ME (ждём 401); POST /api/auth/request с плохим адресом → $REQ (ждём 400)"
          [ "$ME" = "401" ] && [ "$REQ" = "400" ] || { echo "::error title=auth::неожиданные коды ответа"; exit 1; }
          PROF=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/profile")
          RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST -F 'file=@health.json;filename=cv.txt' "$P/api/resume")
          echo "::notice title=resume::GET /api/profile без cookie → $PROF (ждём 401); POST /api/resume без cookie → $RES (ждём 401)"
          [ "$PROF" = "401" ] && [ "$RES" = "401" ] || { echo "::error title=resume::неожиданные коды ответа"; exit 1; }
          ONB=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -d '{"targetRole":"x"}' "$P/api/onboarding")
          echo "::notice title=onboarding::PUT /api/onboarding без cookie → $ONB (ждём 401)"
          [ "$ONB" = "401" ] || { echo "::error title=onboarding::неожиданный код ответа"; exit 1; }
          curl -fsS "$P/api/health?deep=2" > deep.json
          echo "::notice title=extract::$(tr -d '\n' < deep.json)"
          node -e 'const h=require("./deep.json"); if(h.extract!=="ok"){console.error("extract self-test failed", h); process.exit(1)}'
          node -e 'const h=require("./deep.json"); if(h.ai_chat!=="ok"){console.log("::warning title=ai_chat::"+h.ai_chat)}; if(!String(h.analysis).startsWith("ok")){console.log("::warning title=analysis::"+h.analysis)}'
