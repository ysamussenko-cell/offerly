name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check secrets
        env:
          V_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          V_ACC: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::notice title=secrets::token_len=${#CLOUDFLARE_API_TOKEN} account_len=${#CLOUDFLARE_ACCOUNT_ID} vars_token_len=${#V_TOKEN} vars_account_len=${#V_ACC}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error title=secrets::CLOUDFLARE_API_TOKEN пуст — секрет не найден в Repository secrets"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error title=secrets::CLOUDFLARE_ACCOUNT_ID пуст"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Ensure Pages project exists
        run: npx wrangler pages project create offerly --production-branch main || true

      - name: Ensure D1 database exists and resolve its id
        id: d1
        run: |
          set +e
          mv wrangler.toml wrangler.toml.tpl
          CREATE=$(npx wrangler d1 create offerly 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 create::${CREATE:0:600}"
          INFO=$(npx wrangler d1 info offerly --json 2>&1 | tr "\n\r" "  "); echo "::notice title=d1 info::${INFO:0:600}"
          ID=$(echo "$INFO" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.uuid||j.id||"")}catch(e){console.log("")}})')
          mv wrangler.toml.tpl wrangler.toml
          set -e
          if [ -z "$ID" ]; then echo "::error title=d1::database id not resolved"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply offerly --remote

      - name: Seed first user (idempotent)
        run: |
          set -o pipefail
          OUT=$(npx wrangler d1 execute offerly --remote --yes --file seed/first_user.sql 2>&1 | tr "\n\r" "  ") || { echo "::error title=seed::seed/first_user.sql не применился: ${OUT:0:600}"; exit 1; }
          echo "::notice title=seed::применён seed/first_user.sql: ${OUT:0:300}"
          Q="SELECT (SELECT count(*) FROM users WHERE email = 'ysamussenko@gmail.com') AS first_user, (SELECT count(*) FROM assessments WHERE kind = 'baseline') AS baseline, (SELECT count(*) FROM error_cards WHERE source = 'seed') AS seed_cards, (SELECT count(*) FROM error_cards) AS all_cards, (SELECT count(*) FROM error_cards WHERE retired = 1) AS retired, (SELECT count(*) FROM error_cards WHERE reviewed_at IS NOT NULL OR origin IS NOT NULL) AS fsrs_touched"
          CNT=$(npx wrangler d1 execute offerly --remote --yes --json --command "$Q" 2>&1 | tr "\n\r" "  ")
          echo "::notice title=seed counts::${CNT:0:500}"

      - name: Push mail secret to Pages (if set)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            OUT=$(printf '%s' "$RESEND_API_KEY" | npx wrangler pages secret put RESEND_API_KEY --project-name offerly 2>&1 | tr "\n\r" "  ")
            echo "::notice title=mail::RESEND_API_KEY передан в Pages: ${OUT:0:300}"
          else
            echo "::notice title=mail::RESEND_API_KEY не задан — вход по почте вернёт mail_not_configured"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          OUT=$(npx wrangler pages deploy dist --project-name offerly --branch main --commit-dirty=true 2>&1 | tee deploy.log | tr "\n\r" "  ")
          echo "::notice title=deploy::${OUT:0:800}"
          PREVIEW=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          HOST=${PREVIEW#https://}
          PROD="https://${HOST#*.}"
          echo "::notice title=url::production=$PROD preview=$PREVIEW"
          echo "prod=$PROD" >> "$GITHUB_OUTPUT"

      # 4.4: cron-Worker ежедневного письма — отдельный от Pages деплой-объект (Pages Functions не умеют расписание).
      # Та же база D1 и тот же RESEND_API_KEY. Сбой здесь не валит деплой приложения: предупреждение в аннотациях,
      # причина (чаще всего — токену не хватает права Workers Scripts: Edit) видна в digest deploy.
      - name: Deploy digest Worker (cron)
        id: digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          sed -i "s/__D1_ID__/${{ steps.d1.outputs.id }}/" workers/digest/wrangler.toml
          npx wrangler deploy --config workers/digest/wrangler.toml > digest-deploy.log 2>&1; CODE=$?
          OUT=$(tr "\n\r" "  " < digest-deploy.log)
          if [ "$CODE" != "0" ]; then
            echo "::warning title=digest deploy::Worker offerly-digest не задеплоен (код $CODE): ${OUT:0:700}"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' digest-deploy.log | tail -1)
          echo "::notice title=digest deploy::${OUT:0:600}"
          echo "::notice title=digest url::${URL:-адрес workers.dev не напечатан — поддомен workers.dev не зарегистрирован; cron работает и без него}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$RESEND_API_KEY" ]; then
            SEC=$(printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config workers/digest/wrangler.toml 2>&1 | tr "\n\r" "  ") || echo "::warning title=digest secret::RESEND_API_KEY не передан Worker: ${SEC:0:400}"
            echo "::notice title=digest secret::${SEC:0:300}"
          else
            echo "::notice title=digest secret::RESEND_API_KEY не задан — Worker отметит дни skipped:mail_not_configured"
          fi

      # GitHub показывает не больше 10 аннотаций notice на шаг — проверки разнесены по трём шагам.
      - name: Health check
        run: |
          sleep 20
          P="${{ steps.deploy.outputs.prod }}"
          curl -fsS "$P/api/health" | tee health.json
          echo "::notice title=health::$(tr -d '\n' < health.json)"
          node -e 'const h=require("./health.json"); if(!h.ok||h.db!=="ok"||h.ai!=="ok"){console.error("health not ok", h); process.exit(1)}'

      - name: Smoke test
        run: |
          P="${{ steps.deploy.outputs.prod }}"
          ME=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/me")
          REQ=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"email":"bad"}' "$P/api/auth/request")
          echo "::notice title=auth::GET /api/me без cookie → $ME (ждём 401); POST /api/auth/request с плохим адресом → $REQ (ждём 400)"
          [ "$ME" = "401" ] && [ "$REQ" = "400" ] || { echo "::error title=auth::неожиданные коды ответа"; exit 1; }
          PROF=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/profile")
          RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST -F 'file=@health.json;filename=cv.txt' "$P/api/resume")
          echo "::notice title=resume::GET /api/profile без cookie → $PROF (ждём 401); POST /api/resume без cookie → $RES (ждём 401)"
          [ "$PROF" = "401" ] && [ "$RES" = "401" ] || { echo "::error title=resume::неожиданные коды ответа"; exit 1; }
          ONB=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -d '{"targetRole":"x"}' "$P/api/onboarding")
          echo "::notice title=onboarding::PUT /api/onboarding без cookie → $ONB (ждём 401)"
          [ "$ONB" = "401" ] || { echo "::error title=onboarding::неожиданный код ответа"; exit 1; }
          TOP=$(curl -s -o topics.json -w '%{http_code}' "$P/api/items/topics")
          NTOP=$(node -e 'const t=require("./topics.json"); console.log((t.topics||[]).length+" тем, "+(t.kinds||[]).length+" вида, уровни "+(t.levels||[]).join("/"))')
          STATS=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/items/stats")
          GEN=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"kind":"mcq","level":"B1","topic":"articles"}' "$P/api/items/generate")
          echo "::notice title=items::GET /api/items/topics → $TOP ($NTOP); GET /api/items/stats без cookie → $STATS (ждём 401); POST /api/items/generate без cookie → $GEN (ждём 401)"
          [ "$TOP" = "200" ] && [ "$STATS" = "401" ] && [ "$GEN" = "401" ] || { echo "::error title=items::неожиданные коды ответа"; exit 1; }
          ASG=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/assessment")
          AST=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/assessment/start")
          ASA=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"attemptId":"x","answer":"A"}' "$P/api/assessment/answer")
          ASS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/assessment/score")
          echo "::notice title=assessment::GET /api/assessment без cookie → $ASG; POST /api/assessment/start → $AST; POST /api/assessment/answer → $ASA; POST /api/assessment/score → $ASS (ждём 401 везде)"
          [ "$ASG" = "401" ] && [ "$AST" = "401" ] && [ "$ASA" = "401" ] || { echo "::error title=assessment::неожиданные коды ответа"; exit 1; }
          CRD=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/cards")
          echo "::notice title=cards::GET /api/cards без cookie → $CRD (ждём 401)"
          [ "$CRD" = "401" ] || { echo "::error title=cards::неожиданный код ответа"; exit 1; }
          PRG=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/program")
          PRGEN=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/program/generate")
          PRSW=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"a":"x","b":"y"}' "$P/api/program/swap")
          echo "::notice title=program::GET /api/program без cookie → $PRG; POST /api/program/generate → $PRGEN; POST /api/program/swap → $PRSW (ждём 401 везде)"
          [ "$PRG" = "401" ] && [ "$PRGEN" = "401" ] && [ "$PRSW" = "401" ] || { echo "::error title=program::неожиданные коды ответа"; exit 1; }
          LSN=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/lesson")
          LST=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/lesson/start")
          LSA=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"stepId":"x","answer":"A"}' "$P/api/lesson/answer")
          echo "::notice title=lesson::GET /api/lesson без cookie → $LSN; POST /api/lesson/start → $LST; POST /api/lesson/answer → $LSA (ждём 401 везде)"
          [ "$LSN" = "401" ] && [ "$LST" = "401" ] && [ "$LSA" = "401" ] || { echo "::error title=lesson::неожиданные коды ответа"; exit 1; }
          LSB=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"accept":true}' "$P/api/lesson/bonus")
          ACH=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/achievements")
          ACS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/achievements/seen")
          echo "::notice title=achievements::POST /api/lesson/bonus без cookie → $LSB; GET /api/achievements → $ACH; POST /api/achievements/seen → $ACS (ждём 401 везде)"
          [ "$LSB" = "401" ] && [ "$ACH" = "401" ] && [ "$ACS" = "401" ] || { echo "::error title=achievements::неожиданные коды ответа"; exit 1; }
          DSH=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/dashboard")
          DSG=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -d '{"minutes":100}' "$P/api/dashboard/goal")
          echo "::notice title=dashboard::GET /api/dashboard без cookie → $DSH; PUT /api/dashboard/goal → $DSG (ждём 401 везде)"
          [ "$DSH" = "401" ] && [ "$DSG" = "401" ] || { echo "::error title=dashboard::неожиданные коды ответа"; exit 1; }

      - name: Deep check (extract, model, analysis)
        run: |
          P="${{ steps.deploy.outputs.prod }}"
          curl -fsS "$P/api/health?deep=2" > deep.json
          echo "::notice title=extract::$(tr -d '\n' < deep.json)"
          node -e 'const h=require("./deep.json"); if(h.extract!=="ok"){console.error("extract self-test failed", h); process.exit(1)}'
          node -e 'const h=require("./deep.json"); if(h.ai_chat!=="ok"){console.log("::warning title=ai_chat::"+h.ai_chat)}; if(!String(h.analysis).startsWith("ok")){console.log("::warning title=analysis::"+h.analysis)}'
          SW=$(curl -s -o /dev/null -w '%{http_code}' "$P/sw.js"); MF=$(curl -s -o /dev/null -w '%{http_code}' "$P/manifest.webmanifest")
          THEME=$(curl -fsS "$P/" | grep -c 'data-theme' || true)
          echo "::notice title=pwa::GET /sw.js → $SW; GET /manifest.webmanifest → $MF (ждём 200); скрипт темы в index.html: $THEME"
          [ "$SW" = "200" ] && [ "$MF" = "200" ] || { echo "::error title=pwa::service worker или манифест не отдаются"; exit 1; }
          # репетиция интервью (4.1) — здесь, а не в Smoke test: там уже 10 аннотаций notice (предел GitHub на шаг)
          RHG=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/rehearsal")
          RHS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/rehearsal/start")
          RHA=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"turnId":"x","answer":"A"}' "$P/api/rehearsal/answer")
          RHR=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/rehearsal/review")
          RHB=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/rehearsal/abandon")
          echo "::notice title=rehearsal::GET /api/rehearsal без cookie → $RHG; POST /api/rehearsal/start → $RHS; POST /api/rehearsal/answer → $RHA; POST /api/rehearsal/review → $RHR; POST /api/rehearsal/abandon → $RHB (ждём 401 везде)"
          [ "$RHG" = "401" ] && [ "$RHS" = "401" ] && [ "$RHA" = "401" ] && [ "$RHR" = "401" ] && [ "$RHB" = "401" ] || { echo "::error title=rehearsal::неожиданные коды ответа"; exit 1; }
          # голос (4.2): маршруты без cookie → 401; голосовой контур (MeloTTS → Whisper) уже прогнан в deep=2 — строка voice
          VT=$(curl -s -o /dev/null -w '%{http_code}' -X POST -F 'audio=@health.json;type=audio/wav;filename=a.wav' "$P/api/voice/transcribe")
          VS=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"text":"hello"}' "$P/api/voice/speak")
          VM=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/voice/meta")
          VOICE=$(node -e 'const h=require("./deep.json"); console.log(String(h.voice))')
          echo "::notice title=voice::POST /api/voice/transcribe без cookie → $VT; POST /api/voice/speak → $VS; GET /api/voice/meta → $VM (ждём 401 везде); контур: $VOICE"
          [ "$VT" = "401" ] && [ "$VS" = "401" ] && [ "$VM" = "401" ] || { echo "::error title=voice::неожиданные коды ответа"; exit 1; }
          case "$VOICE" in ok:*) ;; *) echo "::warning title=voice::голосовой контур не подтверждён: $VOICE";; esac
          # контрольный срез (4.3): маршруты без cookie → 401
          CPG=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/checkpoint")
          CPS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/checkpoint/start")
          CPA=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"attemptId":"x","answer":"A"}' "$P/api/checkpoint/answer")
          CPR=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/checkpoint/score")
          CPB=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/checkpoint/abandon")
          echo "::notice title=checkpoint::GET /api/checkpoint без cookie → $CPG; POST /api/checkpoint/start → $CPS; POST /api/checkpoint/answer → $CPA; POST /api/checkpoint/score → $CPR; POST /api/checkpoint/abandon → $CPB (ждём 401 везде)"
          [ "$CPG" = "401" ] && [ "$CPS" = "401" ] && [ "$CPA" = "401" ] && [ "$CPR" = "401" ] && [ "$CPB" = "401" ] || { echo "::error title=checkpoint::неожиданные коды ответа"; exit 1; }
          # ежедневное письмо (4.4): маршруты без cookie → 401; состояние cron-Worker (без адресов: сколько ждут письма и в каком состоянии)
          DGG=$(curl -s -o /dev/null -w '%{http_code}' "$P/api/digest")
          DGP=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -d '{"notifyAt":"07:00"}' "$P/api/digest")
          DGS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$P/api/digest/send")
          W="${{ steps.digest.outputs.url }}"
          if [ -n "$W" ]; then WS=$(curl -s --max-time 20 "$W/" | tr -d '\n' | head -c 400); else WS="worker без адреса workers.dev или не задеплоен — см. digest deploy"; fi
          echo "::notice title=digest::GET /api/digest без cookie → $DGG; PUT /api/digest → $DGP; POST /api/digest/send → $DGS (ждём 401 везде); worker: $WS"
          [ "$DGG" = "401" ] && [ "$DGP" = "401" ] && [ "$DGS" = "401" ] || { echo "::error title=digest::неожиданные коды ответа"; exit 1; }
          case "$WS" in *'"ok":true'*) ;; *) echo "::warning title=digest::состояние Worker не подтверждено: $WS";; esac
