<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141C2B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Offerly" />
    <script>
      // Тема до загрузки стилей, чтобы не мигало светлым: та же логика, что в src/theme.ts (auto — тёмная с 20:00 до 7:00 или по системе).
      (function () {
        var m; try { m = localStorage.getItem('offerly.theme'); } catch (e) {}
        var h = new Date().getHours();
        var dark = m === 'dark' || (m !== 'light' && ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) || h >= 20 || h < 7));
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var t = document.querySelector('meta[name="theme-color"]'); if (t && dark) t.setAttribute('content', '#0F1520');
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-maskable-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Offerly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
